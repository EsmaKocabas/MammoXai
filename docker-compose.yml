services:

  # AI MODEL
  ai-model:
    build:
      context: ./backend/ai_model
      dockerfile: Dockerfile

    container_name: mammoxai-ai
    restart: unless-stopped

    expose:
      - "8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: mammoxai-backend
    restart: unless-stopped

    expose:
      - "5001"

    env_file:
      - .env

    environment:
      PORT: 5001
      NODE_ENV: production
      AI_SERVICE_URL: http://ai-model:8000
      AI_TIMEOUT_MS: 120000

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      ai-model:
        condition: service_healthy

  # FRONTEND + NGINX
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: mammoxai-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_started

volumes:
  uploads_data:
